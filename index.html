<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON API Proxy Seguro</title>
</head>
<body>
<script>
(async function(){
  const BASE_URL = "https://cdn-star.netlify.app/"; // Seu Netlify
  const BLOQUEIO_URL = BASE_URL + "bloqueio.html";

  // Verifica se já está bloqueado
  if(localStorage.getItem("bloqueado") === "true"){
    window.location.href = BLOQUEIO_URL;
    return;
  }

  // Pega ?search=
  const file = new URLSearchParams(location.search).get("search");

  // Bloqueia caracteres suspeitos
  const suspeitos = /['";=<>{}]/;
  if(!file){
    document.body.innerHTML = "<pre>{\"error\":\"Nenhum arquivo especificado\",\"code\":400}</pre>";
    return;
  }
  if(suspeitos.test(file)){
    localStorage.setItem("bloqueado","true"); // bloqueia permanentemente
    window.location.href = BLOQUEIO_URL;
    return;
  }

  try{
    const res = await fetch(BASE_URL + file);
    if(!res.ok) throw new Error("Arquivo não encontrado");

    const text = await res.text();
    let json;
    try{
      json = JSON.parse(text); // tenta JSON
    }catch{
      json = text.split("\n"); // se TXT, transforma em array JSON
    }

    // Exibe JSON puro no navegador
    document.body.innerHTML = "<pre>" + JSON.stringify(json,null,2) + "</pre>";
  }catch(e){
    document.body.innerHTML = "<pre>{\"error\":\""+e.message+"\",\"code\":404}</pre>";
  }
})();
</script>
</body>
</html>

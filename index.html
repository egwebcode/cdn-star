<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON API Proxy</title>
</head>
<body>
<script>
(async function(){
  const BASE_URL = "https://cdn-star.netlify.app/"; // Coloque aqui seu Netlify
  const qs = new URLSearchParams(window.location.search);
  const file = qs.get("q");

  // Função para retornar JSON direto na página
  function returnJSON(json){
    document.body.innerHTML = "<pre>" + JSON.stringify(json, null, 2) + "</pre>";
  }

  // Função para retornar erro JSON
  function returnError(msg, code=405){
    document.body.innerHTML = "<pre>" + JSON.stringify({error: msg, code: code}, null, 2) + "</pre>";
  }

  if(!file){
    returnError("Nenhum arquivo especificado. Use ?q=arquivo.txt ou ?q=arquivo.json", 400);
    return;
  }

  // Bloqueia caracteres suspeitos de ataque
  const blocked = /['";=]/;
  if(blocked.test(file)){
    returnError("Método não permitido", 405);
    return;
  }

  try{
    const res = await fetch(BASE_URL + file);
    if(!res.ok) throw new Error("Arquivo não encontrado");
    const text = await res.text();
    let json;
    try{
      json = JSON.parse(text); // tenta JSON
    }catch{
      json = text.split("\n"); // se TXT, transforma em array
    }
    returnJSON(json);
  }catch(e){
    returnError(e.message, 404);
  }
})();
</script>
</body>
</html>

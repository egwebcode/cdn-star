<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON API Proxy</title>
</head>
<body>
<script>
(async function(){
  const BASE_URL = "https://cdn-star.netlify.app/"; // Coloque aqui seu site Netlify
  const qs = new URLSearchParams(window.location.search);
  const file = qs.get("q");
  if(!file){
    document.body.innerHTML = "<h2>Use ?q=arquivo.json ou ?q=arquivo.txt na URL</h2>";
    return;
  }
  try{
    const res = await fetch(BASE_URL + file);
    if(!res.ok) throw new Error("Arquivo não encontrado");
    const text = await res.text();
    let json;
    try{
      json = JSON.parse(text); // tenta converter em JSON
    }catch{
      // se for TXT, transforma em array JSON por linha
      json = text.split("\n");
    }
    // Cria um Blob com tipo application/json para que o navegador abra igual API
    const blob = new Blob([JSON.stringify(json,null,2)], {type:"application/json"});
    const blobUrl = URL.createObjectURL(blob);
    window.location.href = blobUrl; // abre o JSON no estilo API
  }catch(e){
    document.body.innerHTML = "<pre>"+e+"</pre>";
  }
})();
</script>
</body>
</html>

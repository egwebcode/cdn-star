<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN STAR JS - NETLIFY</title>
  <style>
    body{font-family:monospace;background:#0b1016;color:#e6edf3;margin:0;padding:20px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
    .container{max-width:480px;width:100%;background:#111826;padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
    h1{font-size:18px;margin-bottom:16px;text-align:center;}
    input{width:calc(100% - 100px);padding:10px;font-size:14px;border-radius:6px;border:none;margin-right:8px;}
    button{padding:10px 14px;font-size:14px;border-radius:6px;border:none;background:#4f46e5;color:white;cursor:pointer;}
    button:hover{background:#3730a3;}
    pre{white-space:pre-wrap;background:#0f1623;padding:12px;border-radius:8px;margin-top:12px;max-height:300px;overflow:auto;}
    .flex{display:flex;align-items:center;gap:4px;}
    .copyBtn{margin-top:8px;padding:6px 10px;font-size:13px;border-radius:6px;border:none;background:#16a34a;color:white;cursor:pointer;}
    .copyBtn:hover{background:#15803d;}
    @media(max-width:480px){input{width:100%;margin-bottom:8px;} .flex{flex-direction:column;align-items:stretch;}}
  </style>
</head>
<body>
<div class="container">
  <h1>📂 Buscar arquivo do Netlify</h1>
  <div class="flex">
    <input type="text" id="fileInput" placeholder="Ex: tamperdev.js">
    <button id="searchBtn">Buscar</button>
  </div>
  <pre id="result"></pre>
  <button class="copyBtn" id="copyBtn">📋 Copiar Conteúdo</button>
</div>

<script>
(function(){
  const BASE_URL = "https://cdn-star.netlify.app/"; // substitua pelo seu site real
  const input = document.getElementById("fileInput");
  const btn = document.getElementById("searchBtn");
  const result = document.getElementById("result");
  const copyBtn = document.getElementById("copyBtn");

  function fetchFile(filename){
    if(!filename) return;
    const url = BASE_URL + filename;
    result.textContent = "Carregando...";
    fetch(url)
      .then(res=>{
        if(!res.ok) throw new Error("Arquivo não encontrado");
        return res.text();
      })
      .then(txt=>{
        // Exibe no pre
        result.textContent = txt;
        // Cria link para abrir em nova aba como JSON puro
        const blob = new Blob([txt], {type:"application/json"});
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl,"_blank");
      })
      .catch(err=>{
        result.textContent = "Erro: " + err.message;
      });
  }

  btn.addEventListener("click", ()=>{
    const q = input.value.trim();
    if(!q) return alert("Digite um arquivo");
    // Atualiza URL com ?q= para parecer profissional
    const newUrl = location.origin + location.pathname + "?q=" + encodeURIComponent(q);
    history.pushState(null,null,newUrl);
    fetchFile(q);
  });

  input.addEventListener("keydown", e=>{
    if(e.key==="Enter") btn.click();
  });

  copyBtn.addEventListener("click", ()=>{
    if(!result.textContent) return;
    navigator.clipboard.writeText(result.textContent).then(()=>{
      alert("Conteúdo copiado!");
    });
  });

  // Se tiver ?q= na URL, busca automaticamente
  const qs = new URLSearchParams(location.search);
  const q = (qs.get("q")||"").trim();
  if(q){
    input.value = q;
    fetchFile(q);
  }

})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON API Viewer Profissional</title>
<style>
body{margin:0;padding:0;font-family:monospace;background:#0b1016;color:#e6edf3;display:flex;justify-content:center;align-items:center;height:100vh;}
iframe{width:90%;height:90vh;border:none;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
pre{padding:20px;}
</style>
</head>
<body>
<script>
(async function(){
  const BASE_URL = "https://cdn-star.netlify.app/"; // Seu Netlify
  const BLOQUEIO_URL = BASE_URL + "bloqueio.html";

  // Bloqueio permanente
  if(localStorage.getItem("bloqueado")==="true"){
    window.location.href = BLOQUEIO_URL;
    return;
  }

  // Pega ?search=
  const file = new URLSearchParams(location.search).get("search");

  // Bloqueia caracteres suspeitos
  const suspeitos = /['";=<>{}]/;
  if(!file){
    document.body.innerHTML = "<pre>{\"error\":\"Nenhum arquivo especificado\",\"code\":400}</pre>";
    return;
  }
  if(suspeitos.test(file)){
    localStorage.setItem("bloqueado","true");
    window.location.href = BLOQUEIO_URL;
    return;
  }

  try{
    // Testa se o arquivo existe
    const res = await fetch(BASE_URL + file, {method:"HEAD"});
    if(!res.ok) throw new Error("Arquivo não encontrado");

    // Cria iframe profissional
    const iframe = document.createElement("iframe");
    iframe.src = BASE_URL + file;
    document.body.appendChild(iframe);

  }catch(e){
    document.body.innerHTML = "<pre>{\"error\":\""+e.message+"\",\"code\":404}</pre>";
  }

})();
</script>
</body>
</html>

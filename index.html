<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API DE CONSULTA JS</title>
<style>
html, body {margin:0;padding:0;width:100%;height:100%;background:#0b1016;}
iframe {width:100%;height:100%;border:none;}
pre {padding:20px;color:#e6edf3;font-family:monospace;}
</style>
</head>
<body>
<script>
(async function(){
  const BASE_URL = "https://cdn-star.netlify.app/"; // Seu Netlify
  const BLOQUEIO_URL = BASE_URL + "404.html";

  if(localStorage.getItem("ㅤ")==="ㅤ"){
    window.location.href = BLOQUEIO_URL;
    return;
  }

  const file = new URLSearchParams(location.search).get("search");

  const suspeitos = /['";=<>{}]/;
  if(!file){
    document.body.innerHTML = "<pre>{\"error\":\"Use /?search= para pesquisar na api\",\"code\":400}</pre>";
    return;
  }
  if(suspeitos.test(file)){
    localStorage.setItem("ㅤ","ㅤ");
    window.location.href = BLOQUEIO_URL;
    return;
  }

  try{
    // Testa se o arquivo existe
    const res = await fetch(BASE_URL + file, {method:"HEAD"});
    if(!res.ok) throw new Error("Arquivo não encontrado");

    // Cria iframe full-screen
    const iframe = document.createElement("iframe");
    iframe.src = BASE_URL + file;
    document.body.appendChild(iframe);

  }catch(e){
    document.body.innerHTML = "<pre>{\"error\":\""+e.message+"\",\"code\":404}</pre>";
  }

})();
</script>
</body>
</html>

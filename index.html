<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>CDN STAR JS- Netlify</title>
  <style>
    body{font-family:monospace;background:#0b1016;color:#e6edf3;margin:0;padding:20px}
    .container{max-width:600px;margin:auto}
    input{width:80%;padding:8px;font-size:14px;border-radius:4px;border:none;margin-right:4px}
    button{padding:8px 12px;font-size:14px;border-radius:4px;border:none;background:#4f46e5;color:white;cursor:pointer}
    button:hover{background:#3730a3}
    pre{white-space:pre-wrap;background:#111826;padding:12px;border-radius:6px;margin-top:12px;}
  </style>
</head>
<body>
<div class="container">
  <h1>📂 Buscar arquivo real do Netlify</h1>
  <input type="text" id="fileInput" placeholder="Ex: emails.txt" />
  <button id="searchBtn">Buscar</button>
  <pre id="result"></pre>
</div>

<script>
(function(){
  const input = document.getElementById("fileInput");
  const btn = document.getElementById("searchBtn");
  const result = document.getElementById("result");
  const BASE_URL = "https://cdn-star.netlify.app/"; // substitua pelo seu site real

  function fetchFile(filename){
    if(!filename) return;
    const url = BASE_URL + filename;
    result.textContent = "Carregando...";
    fetch(url)
      .then(res=>{
        if(!res.ok) throw new Error("Arquivo não encontrado");
        return res.text();
      })
      .then(txt=>{
        // Transformar .txt em array JSON, .json em JSON puro
        if(filename.endsWith(".txt")){
          result.textContent = JSON.stringify(txt.split("\n"), null, 2);
        } else {
          try{
            const json = JSON.parse(txt);
            result.textContent = JSON.stringify(json, null, 2);
          }catch{
            result.textContent = txt;
          }
        }
      })
      .catch(err=>{
        result.textContent = JSON.stringify({error: err.message}, null, 2);
      });
  }

  btn.addEventListener("click", ()=>{
    const q = input.value.trim();
    fetchFile(q);
  });

  input.addEventListener("keydown", e=>{
    if(e.key==="Enter") btn.click();
  });

  // Se tiver ?q= na URL, já busca automaticamente
  const qs = new URLSearchParams(location.search);
  const q = (qs.get("q")||"").trim();
  if(q) fetchFile(q);

})();
</script>
</body>
</html>
